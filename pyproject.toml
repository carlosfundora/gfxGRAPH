[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "gfxgraph"
version = "0.3.1"
description = "Drop-in CUDA Graph parity for AMD gfx1030 RDNA2"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Carlos Fundora"}]
dependencies = ["torch>=2.9"]

[project.scripts]
gfxgraph = "gfxgraph.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["gfxgraph*", "hipgraph_bridge*", "gfxgraph_stats*"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "gfxgraph_stats"
