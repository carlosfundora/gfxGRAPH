[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gfxgraph"
version = "1.0.0"
description = "Drop-in CUDA Graph → HIP Graph translation layer for AMD gfx1030/1031 (RDNA2): safe eager fallback, dynamic-shape bucketing, illegal-access GUARD, and always-on bilingual (English/中文) HIP/ROCm error & status diagnostics."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Carlos Fundora"}]
maintainers = [{name = "Carlos Fundora"}]
keywords = ["rocm", "hip", "amd", "gfx1030", "rdna2", "cuda-graph", "pytorch", "diagnostics", "flash-attention"]
dependencies = ["torch>=2.9"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/carlosfundora/gfxGRAPH"
Repository = "https://github.com/carlosfundora/gfxGRAPH"
Issues = "https://github.com/carlosfundora/gfxGRAPH/issues"
Documentation = "https://github.com/carlosfundora/gfxGRAPH/tree/main/docs"

[project.scripts]
gfxgraph = "gfxgraph.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["gfxgraph*", "hipgraph_bridge*"]
