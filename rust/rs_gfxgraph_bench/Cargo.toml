[package]
name = "rs_gfxgraph_bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gfxgraph-bench-gate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
rs_gfxgraph_core = { path = "../rs_gfxgraph_core" }
rs_gfxgraph_native = { path = "../rs_gfxgraph_native" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
