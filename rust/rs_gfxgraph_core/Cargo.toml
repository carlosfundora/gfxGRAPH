[package]
name = "rs_gfxgraph_core"
version = "0.1.0"
edition = "2021"

[dependencies]
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rs_logly_mesh = { path = "../../core/rs_logly_mesh", optional = true }

rs_policy_mesh = { path = "../../core/rs_policy_mesh", optional = true }
[dev-dependencies]

[features]
default = ["mesh-aware", "policy"]
mesh-aware = ["dep:rs_logly_mesh"]
policy = ["dep:rs_policy_mesh"]

[lib]
name = "rs_gfxgraph_core"
path = "src/lib.rs"

[lints]
workspace = true
